[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptocave-threshold-education"
version = "0.5.0"
description = "Readable educational foundations for VSS, DKG, and FROST"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Anastasios Voudouris"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]

[tool.setuptools]
packages = ["cryptocave_sss"]
