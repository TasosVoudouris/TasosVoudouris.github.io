[package]
name = "rot-mtc"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Root of Trust, part 11: the Merkle tree, subtree, tile and MTC core of the series, in Rust, checked against the Python reference"
license = "MIT"
publish = false

[dependencies]
sha2 = "0.11"

[dev-dependencies]
serde_json = "1"
hex = "0.4"

[profile.test]
opt-level = 2   # the Appendix C vectors run tens of thousands of proofs
