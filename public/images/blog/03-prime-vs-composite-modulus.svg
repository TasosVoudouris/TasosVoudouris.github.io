<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Prime versus composite modular arithmetic</title>
<desc id="desc">A side-by-side comparison of Z7, where every nonzero element is invertible, and Z15, where zero divisors such as 3 and 5 appear.</desc>

<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0%" stop-color="#07110d"/>
    <stop offset="100%" stop-color="#0b1519"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<rect width="1200" height="520" rx="28" fill="url(#bg)"/>

<text x="600" y="55" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="30" font-weight="700">
  Same modular idea. Very different multiplication.
</text>

<!-- left panel -->
<rect x="55" y="95" width="510" height="355" rx="24"
      fill="#0e1c17" stroke="#58f7a6" stroke-width="2"/>

<text x="310" y="140" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="28" font-weight="700">Z₇ — prime modulus</text>

<text x="310" y="177" text-anchor="middle"
      fill="#9bb9aa" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="18">Every non-zero residue is a unit</text>

<g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" text-anchor="middle">
  <circle cx="150" cy="250" r="34" fill="#153428" stroke="#58f7a6" stroke-width="2"/>
  <text x="150" y="258" fill="#eafff3">1</text>

  <circle cx="230" cy="250" r="34" fill="#153428" stroke="#58f7a6" stroke-width="2"/>
  <text x="230" y="258" fill="#eafff3">2</text>

  <circle cx="310" cy="250" r="34" fill="#153428" stroke="#58f7a6" stroke-width="2"/>
  <text x="310" y="258" fill="#eafff3">3</text>

  <circle cx="390" cy="250" r="34" fill="#153428" stroke="#58f7a6" stroke-width="2"/>
  <text x="390" y="258" fill="#eafff3">4</text>

  <circle cx="190" cy="335" r="34" fill="#153428" stroke="#58f7a6" stroke-width="2"/>
  <text x="190" y="343" fill="#eafff3">5</text>

  <circle cx="350" cy="335" r="34" fill="#153428" stroke="#58f7a6" stroke-width="2"/>
  <text x="350" y="343" fill="#eafff3">6</text>
</g>

<text x="310" y="410" text-anchor="middle"
      fill="#58f7a6" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="20" font-weight="700">
  non-zero ⇒ invertible
</text>

<!-- right panel -->
<rect x="635" y="95" width="510" height="355" rx="24"
      fill="#171714" stroke="#f2b84b" stroke-width="2"/>

<text x="890" y="140" text-anchor="middle"
      fill="#fff8e8" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="28" font-weight="700">Z₁₅ — composite modulus</text>

<text x="890" y="177" text-anchor="middle"
      fill="#bdb39a" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="18">Non-zero does not imply invertible</text>

<g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
  <circle cx="770" cy="260" r="48" fill="#352715" stroke="#f2b84b" stroke-width="3" filter="url(#glow)"/>
  <text x="770" y="269" fill="#fff8e8" font-size="30" font-weight="700">3</text>

  <text x="890" y="268" fill="#f2b84b" font-size="34" font-weight="700">×</text>

  <circle cx="1010" cy="260" r="48" fill="#352715" stroke="#f2b84b" stroke-width="3" filter="url(#glow)"/>
  <text x="1010" y="269" fill="#fff8e8" font-size="30" font-weight="700">5</text>

  <text x="890" y="342" fill="#fff8e8" font-size="28" font-weight="700">
    3 · 5 ≡ 0 (mod 15)
  </text>

  <text x="890" y="390" fill="#f2b84b" font-size="20" font-weight="700">
    non-zero zero divisors
  </text>
</g>

<text x="600" y="490" text-anchor="middle"
      fill="#819c8d" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="17">
  Before dividing in a cryptographic derivation, first ask: does the inverse actually exist?
</text>
</svg>
