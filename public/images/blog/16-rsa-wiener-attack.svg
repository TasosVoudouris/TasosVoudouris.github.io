<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Wiener's attack on RSA using continued fractions</title>
<desc id="desc">The public ratio e over N is expanded as a continued fraction. One convergent is k over d equal to one fifth. The candidate reconstructs phi, the sum of the RSA primes, a perfect-square discriminant, and finally the prime factors and private exponent.</desc>

<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0%" stop-color="#07110d"/>
    <stop offset="100%" stop-color="#0b1519"/>
  </linearGradient>
  <marker id="arrowG" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#58f7a6"/>
  </marker>
  <marker id="arrowGold" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#f2b84b"/>
  </marker>
</defs>

<rect width="1200" height="690" rx="28" fill="url(#bg)"/>

<text x="600" y="48" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="30" font-weight="700">
  Wiener: a tiny private exponent becomes a public rational approximation
</text>

<!-- Public key -->
<rect x="70" y="95" width="310" height="125" rx="20"
      fill="#0e1c17" stroke="#58f7a6" stroke-width="2"/>
<text x="225" y="130" text-anchor="middle" fill="#eafff3"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">public key</text>
<text x="225" y="165" text-anchor="middle" fill="#58f7a6"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">N = 90,581</text>
<text x="225" y="195" text-anchor="middle" fill="#58f7a6"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">e = 17,993</text>

<!-- CF -->
<rect x="445" y="95" width="690" height="125" rx="20"
      fill="#171714" stroke="#f2b84b" stroke-width="2"/>
<text x="790" y="130" text-anchor="middle" fill="#fff8e8"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">continued fraction of e/N</text>
<text x="790" y="166" text-anchor="middle" fill="#f2b84b"
      font-family="Consolas,monospace" font-size="20">[0; 5, 29, 4, 1, 3, 2, 4, 3]</text>
<text x="790" y="198" text-anchor="middle" fill="#bdb39a"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Euclidean algorithm → convergents</text>

<line x1="380" y1="158" x2="435" y2="158"
      stroke="#f2b84b" stroke-width="3" marker-end="url(#arrowGold)"/>

<!-- convergent -->
<rect x="365" y="280" width="470" height="105" rx="20"
      fill="#231517" stroke="#ff7b72" stroke-width="2"/>
<text x="600" y="316" text-anchor="middle" fill="#fff0ef"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">secret approximation appears</text>
<text x="600" y="353" text-anchor="middle" fill="#ff9b94"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27">k/d = 1/5</text>

<path d="M790 220 C760 250,690 265,630 275"
      fill="none" stroke="#ff7b72" stroke-width="3" marker-end="url(#arrowG)"/>

<!-- phi -->
<rect x="75" y="445" width="305" height="105" rx="19"
      fill="#10251c" stroke="#58f7a6" stroke-width="2"/>
<text x="227" y="480" text-anchor="middle" fill="#eafff3"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">candidate φ(N)</text>
<text x="227" y="518" text-anchor="middle" fill="#58f7a6"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">89,964</text>

<!-- S -->
<rect x="447" y="445" width="305" height="105" rx="19"
      fill="#10251c" stroke="#58f7a6" stroke-width="2"/>
<text x="599" y="480" text-anchor="middle" fill="#eafff3"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">S = p + q</text>
<text x="599" y="518" text-anchor="middle" fill="#58f7a6"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">618</text>

<!-- Delta -->
<rect x="820" y="445" width="305" height="105" rx="19"
      fill="#10251c" stroke="#58f7a6" stroke-width="2"/>
<text x="972" y="480" text-anchor="middle" fill="#eafff3"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">Δ = S² − 4N</text>
<text x="972" y="518" text-anchor="middle" fill="#58f7a6"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">19,600 = 140²</text>

<path d="M520 385 C410 410,310 425,250 438"
      fill="none" stroke="#58f7a6" stroke-width="3" marker-end="url(#arrowG)"/>
<path d="M600 385 L600 435"
      fill="none" stroke="#58f7a6" stroke-width="3" marker-end="url(#arrowG)"/>
<path d="M680 385 C790 410,890 425,950 438"
      fill="none" stroke="#58f7a6" stroke-width="3" marker-end="url(#arrowG)"/>

<!-- result -->
<rect x="300" y="600" width="600" height="66" rx="18"
      fill="#231517" stroke="#ff7b72" stroke-width="2"/>
<text x="600" y="627" text-anchor="middle" fill="#fff0ef"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">
  recovered d = 5 · p = 379 · q = 239
</text>
<text x="600" y="651" text-anchor="middle" fill="#ff9b94"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">
  total private-key recovery from public (N,e)
</text>

<path d="M227 550 C330 575,430 588,500 598"
      fill="none" stroke="#ff7b72" stroke-width="2.5" marker-end="url(#arrowG)"/>
<path d="M599 550 L599 590"
      fill="none" stroke="#ff7b72" stroke-width="2.5" marker-end="url(#arrowG)"/>
<path d="M972 550 C870 575,770 588,700 598"
      fill="none" stroke="#ff7b72" stroke-width="2.5" marker-end="url(#arrowG)"/>
</svg>
