<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Chinese Remainder Theorem reconstruction</title>
<desc id="desc">Three congruences modulo 3, 5, and 7 converge to the same solution x equals 23 modulo 105.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0%" stop-color="#07110d"/>
    <stop offset="100%" stop-color="#0b1519"/>
  </linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#58f7a6"/>
  </marker>
</defs>
<rect width="1200" height="620" rx="28" fill="url(#bg)"/>
<text x="600" y="58" text-anchor="middle" fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">
  Several modular views can identify one residue class
</text>
<text x="600" y="92" text-anchor="middle" fill="#9bb9aa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">
  Pairwise-coprime moduli 3, 5, and 7 combine into one modulus 3 · 5 · 7 = 105
</text>

<rect x="70" y="155" width="300" height="135" rx="20" fill="#0e1c17" stroke="#58f7a6" stroke-width="2"/>
<text x="220" y="194" text-anchor="middle" fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">x ≡ 2 (mod 3)</text>
<text x="220" y="231" text-anchor="middle" fill="#9bb9aa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">2, 5, 8, 11, 14, …</text>
<text x="220" y="265" text-anchor="middle" fill="#58f7a6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">…, 23, …</text>

<rect x="450" y="155" width="300" height="135" rx="20" fill="#0e1c17" stroke="#58f7a6" stroke-width="2"/>
<text x="600" y="194" text-anchor="middle" fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">x ≡ 3 (mod 5)</text>
<text x="600" y="231" text-anchor="middle" fill="#9bb9aa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">3, 8, 13, 18, …</text>
<text x="600" y="265" text-anchor="middle" fill="#58f7a6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">…, 23, …</text>

<rect x="830" y="155" width="300" height="135" rx="20" fill="#0e1c17" stroke="#58f7a6" stroke-width="2"/>
<text x="980" y="194" text-anchor="middle" fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">x ≡ 2 (mod 7)</text>
<text x="980" y="231" text-anchor="middle" fill="#9bb9aa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">2, 9, 16, …</text>
<text x="980" y="265" text-anchor="middle" fill="#58f7a6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">…, 23, …</text>

<path d="M220 290 C275 350,380 370,495 390" fill="none" stroke="#58f7a6" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M600 290 L600 382" fill="none" stroke="#58f7a6" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M980 290 C925 350,820 370,705 390" fill="none" stroke="#58f7a6" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="390" y="395" width="420" height="105" rx="22" fill="#10251c" stroke="#58f7a6" stroke-width="2"/>
<text x="600" y="433" text-anchor="middle" fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Common solution</text>
<text x="600" y="474" text-anchor="middle" fill="#58f7a6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700">x ≡ 23 (mod 105)</text>

<text x="600" y="552" text-anchor="middle" fill="#9bb9aa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">
  23, 128, 233, … all look identical modulo 3, 5, and 7
</text>
<text x="600" y="584" text-anchor="middle" fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">
  CRT reconstructs the unique residue modulo the product of the coprime moduli.
</text>
</svg>
