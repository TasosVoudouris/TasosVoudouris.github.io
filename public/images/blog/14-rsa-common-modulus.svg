<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">RSA common modulus attack using Bezout coefficients</title>
<desc id="desc">The same plaintext 9 is encrypted modulo 77 with exponents 7 and 11 to ciphertexts 37 and 53. Extended Euclid gives coefficients 8 and minus 5, which combine the ciphertexts to recover the plaintext.</desc>

<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0%" stop-color="#07110d"/>
    <stop offset="100%" stop-color="#0b1519"/>
  </linearGradient>
  <marker id="arrowG" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#58f7a6"/>
  </marker>
  <marker id="arrowR" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#ff7b72"/>
  </marker>
</defs>

<rect width="1200" height="610" rx="28" fill="url(#bg)"/>

<text x="600" y="50" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="30" font-weight="700">
  Same modulus + same message + coprime exponents → Bézout recovers m
</text>

<!-- Message -->
<rect x="470" y="88" width="260" height="72" rx="18"
      fill="#10251c" stroke="#58f7a6" stroke-width="2"/>
<text x="600" y="117" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="20" font-weight="700">same representative</text>
<text x="600" y="145" text-anchor="middle"
      fill="#58f7a6" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="22">m = 9 · N = 77</text>

<!-- Branches -->
<rect x="100" y="225" width="360" height="125" rx="20"
      fill="#0e1c17" stroke="#58f7a6" stroke-width="2"/>
<text x="280" y="260" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="21" font-weight="700">public exponent e₁ = 7</text>
<text x="280" y="297" text-anchor="middle"
      fill="#58f7a6" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="20">c₁ = 9⁷ mod 77</text>
<text x="280" y="327" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="22" font-weight="700">c₁ = 37</text>

<rect x="740" y="225" width="360" height="125" rx="20"
      fill="#0e1c17" stroke="#58f7a6" stroke-width="2"/>
<text x="920" y="260" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="21" font-weight="700">public exponent e₂ = 11</text>
<text x="920" y="297" text-anchor="middle"
      fill="#58f7a6" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="20">c₂ = 9¹¹ mod 77</text>
<text x="920" y="327" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="22" font-weight="700">c₂ = 53</text>

<path d="M545 160 C470 185,390 205,330 220"
      fill="none" stroke="#58f7a6" stroke-width="3" marker-end="url(#arrowG)"/>
<path d="M655 160 C730 185,810 205,870 220"
      fill="none" stroke="#58f7a6" stroke-width="3" marker-end="url(#arrowG)"/>

<!-- Bezout -->
<rect x="385" y="390" width="430" height="80" rx="19"
      fill="#171714" stroke="#f2b84b" stroke-width="2"/>
<text x="600" y="420" text-anchor="middle"
      fill="#fff8e8" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="21" font-weight="700">Extended Euclid</text>
<text x="600" y="452" text-anchor="middle"
      fill="#f2b84b" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="23">8·7 − 5·11 = 1</text>

<path d="M350 350 C410 375,465 382,510 390"
      fill="none" stroke="#f2b84b" stroke-width="3" marker-end="url(#arrowG)"/>
<path d="M850 350 C790 375,735 382,690 390"
      fill="none" stroke="#f2b84b" stroke-width="3" marker-end="url(#arrowG)"/>

<!-- Recovery -->
<rect x="260" y="505" width="680" height="72" rx="20"
      fill="#231517" stroke="#ff7b72" stroke-width="2"/>
<text x="600" y="534" text-anchor="middle"
      fill="#fff0ef" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="20" font-weight="700">
  37⁸ · 53⁻⁵ mod 77 = 9
</text>
<text x="600" y="562" text-anchor="middle"
      fill="#ff9b94" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="18">
  plaintext recovered · no p, q, d₁, or d₂
</text>

<line x1="600" y1="470" x2="600" y2="495"
      stroke="#ff7b72" stroke-width="3" marker-end="url(#arrowR)"/>

<text x="600" y="602" text-anchor="middle"
      fill="#819c8d" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="16">
  RSA moduli are key-specific trapdoor structure, not reusable global domain parameters.
</text>
</svg>
