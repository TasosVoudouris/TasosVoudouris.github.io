<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<rect width="1400" height="820" fill="#05080d"/>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#0c2a22" stroke-width="1" opacity=".45"/>
  </pattern>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#48e0a4"/>
  </marker>
</defs>
<rect width="1400" height="820" fill="url(#grid)"/>
<text x="70" y="74" font-family="monospace" font-size="32" font-weight="700" fill="#c8ffe4">SHORT-PAD RSA: ELIMINATE → SMALL ROOT → SHARED ROOT</text>
<text x="72" y="108" font-family="monospace" font-size="17" fill="#71bfa2">resultants · Coppersmith · Franklin–Reiter</text>
<g font-family="monospace">
  <rect x="65" y="165" width="340" height="150" rx="18" fill="#08130f" stroke="#2bd894" stroke-width="2"/>
  <text x="90" y="201" fill="#88ffd0" font-size="19" font-weight="700">TWO PADDED VIEWS</text>
  <text x="90" y="243" fill="#e4fff3" font-size="19">M₁ = 2ˢM + r₁</text>
  <text x="90" y="277" fill="#e4fff3" font-size="19">M₂ = 2ˢM + r₂</text>

  <rect x="530" y="165" width="340" height="150" rx="18" fill="#08130f" stroke="#2bd894" stroke-width="2"/>
  <text x="555" y="201" fill="#88ffd0" font-size="19" font-weight="700">SMALL RELATION</text>
  <text x="555" y="245" fill="#e4fff3" font-size="22">Δ = r₂ − r₁</text>
  <text x="555" y="279" fill="#7bbba3" font-size="16">M₂ = M₁ + Δ</text>

  <rect x="995" y="165" width="340" height="150" rx="18" fill="#08130f" stroke="#2bd894" stroke-width="2"/>
  <text x="1020" y="201" fill="#88ffd0" font-size="19" font-weight="700">BIVARIATE SYSTEM</text>
  <text x="1020" y="241" fill="#e4fff3" font-size="17">g₁(X)=X³−C₁</text>
  <text x="1020" y="277" fill="#e4fff3" font-size="17">g₂(X,Y)=(X+Y)³−C₂</text>

  <path d="M405 240H520" stroke="#48e0a4" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M870 240H985" stroke="#48e0a4" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="995" y="400" width="340" height="145" rx="18" fill="#08130f" stroke="#2bd894" stroke-width="2"/>
  <text x="1020" y="437" fill="#88ffd0" font-size="19" font-weight="700">RESULTANT</text>
  <text x="1020" y="478" fill="#e4fff3" font-size="19">h(Y)=Resₓ(g₁,g₂)</text>
  <text x="1020" y="512" fill="#7bbba3" font-size="16">h(Δ) ≡ 0 mod N</text>

  <rect x="530" y="400" width="340" height="145" rx="18" fill="#08130f" stroke="#2bd894" stroke-width="2"/>
  <text x="555" y="437" fill="#88ffd0" font-size="19" font-weight="700">COPPERSMITH</text>
  <text x="555" y="478" fill="#e4fff3" font-size="21">deg h = 9</text>
  <text x="555" y="512" fill="#7bbba3" font-size="16">|Δ| ≲ N^(1/9)</text>

  <rect x="65" y="400" width="340" height="145" rx="18" fill="#08130f" stroke="#2bd894" stroke-width="2"/>
  <text x="90" y="437" fill="#88ffd0" font-size="19" font-weight="700">FRANKLIN–REITER</text>
  <text x="90" y="478" fill="#e4fff3" font-size="19">gcd → X − M₁</text>
  <text x="90" y="512" fill="#7bbba3" font-size="16">known Δ closes the relation</text>

  <path d="M1165 315V390" stroke="#48e0a4" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M995 472H880" stroke="#48e0a4" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M530 472H415" stroke="#48e0a4" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="180" y="650" width="1040" height="100" rx="18" fill="#0b1018" stroke="#4c8cff" stroke-width="2"/>
  <text x="215" y="686" fill="#9cc5ff" font-size="19" font-weight="700">COMPOSITION</text>
  <text x="215" y="723" fill="#eef5ff" font-size="20">eliminate the large variable → recover the small relation → recover the shared message root</text>
</g>
</svg>