<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" role="img" aria-labelledby="t d">
<title id="t">Toy NTRU lattice construction and LLL recovery</title>
<desc id="d">The public polynomial h becomes a circulant matrix H, then the NTRU block lattice, then LLL produces a short vector equivalent to the secret polynomials.</desc>
<style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;fill:#edf2f7}.box{fill:#111827;stroke:#64748b;stroke-width:2}.hot{fill:#1f2937;stroke:#f59e0b;stroke-width:3}.arrow{stroke:#cbd5e1;stroke-width:3;fill:none;marker-end:url(#a)}.title{font-size:27px;font-weight:700}.body{font-size:20px}.small{font-size:17px;fill:#aab4c3}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#cbd5e1"/></marker></defs>
<rect width="1180" height="610" rx="26" fill="#080d16"/>
<text x="55" y="62" class="title">Toy NTRU attack: polynomial relation → public lattice → short key</text>
<rect x="55" y="125" width="245" height="190" rx="18" class="box"/>
<text x="85" y="170" class="body">Public polynomial h</text>
<text x="85" y="218" class="small">f·h ≡ g</text>
<text x="85" y="250" class="small">mod (xᴺ−1, q)</text>
<path d="M305 220 L390 220" class="arrow"/>
<rect x="390" y="125" width="230" height="190" rx="18" class="box"/>
<text x="430" y="170" class="body">Circulant H</text>
<text x="425" y="218" class="small">multiplication by h</text>
<text x="425" y="250" class="small">as a linear map</text>
<path d="M625 220 L710 220" class="arrow"/>
<rect x="710" y="105" width="235" height="230" rx="18" class="hot"/>
<text x="757" y="155" class="body">NTRU lattice</text>
<text x="752" y="210" class="body">[ I   H ]</text>
<text x="752" y="246" class="body">[ 0  qI ]</text>
<text x="745" y="292" class="small">contains (f,g)</text>
<path d="M950 220 L1030 220" class="arrow"/>
<rect x="1030" y="150" width="100" height="140" rx="18" class="box"/>
<text x="1052" y="205" class="body">LLL</text>
<text x="1043" y="245" class="small">reduce</text>
<path d="M1080 295 L1080 395 L855 395" class="arrow"/>
<rect x="590" y="365" width="265" height="165" rx="18" class="box"/>
<text x="625" y="410" class="body">Equivalent short key</text>
<text x="620" y="455" class="small">(φ,γ) · (−x⁴)</text>
<text x="652" y="488" class="small">= (f,g)</text>
<text x="55" y="560" class="small">The toy succeeds because N=7 and q=41 are tiny. This is a geometry demonstration, not a break of real NTRU parameter sets.</text>
</svg>
