<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Why textbook RSA fails</title>
<desc id="desc">Two panels show textbook RSA determinism and multiplicative malleability. A lower panel shows OAEP placing randomized encoding before RSA exponentiation.</desc>

<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0%" stop-color="#07110d"/>
    <stop offset="100%" stop-color="#0b1519"/>
  </linearGradient>
  <marker id="arrowR" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#ff7b72"/>
  </marker>
  <marker id="arrowG" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#58f7a6"/>
  </marker>
</defs>

<rect width="1200" height="620" rx="28" fill="url(#bg)"/>

<text x="600" y="50" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="30" font-weight="700">
  RSA primitive ≠ secure RSA encryption scheme
</text>

<!-- determinism -->
<rect x="55" y="95" width="515" height="245" rx="22"
      fill="#231517" stroke="#ff7b72" stroke-width="2"/>

<text x="312" y="135" text-anchor="middle"
      fill="#fff0ef" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="24" font-weight="700">1 · Determinism</text>

<text x="150" y="190" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="20">m = 42</text>
<text x="150" y="260" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="20">m = 42</text>

<line x1="210" y1="185" x2="400" y2="185"
      stroke="#ff7b72" stroke-width="3" marker-end="url(#arrowR)"/>
<line x1="210" y1="255" x2="400" y2="255"
      stroke="#ff7b72" stroke-width="3" marker-end="url(#arrowR)"/>

<text x="305" y="171" text-anchor="middle"
      fill="#c8a4a1" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="15">RSAEP</text>
<text x="305" y="241" text-anchor="middle"
      fill="#c8a4a1" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="15">RSAEP</text>

<text x="465" y="190" text-anchor="middle"
      fill="#ff9b94" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="20" font-weight="700">2557</text>
<text x="465" y="260" text-anchor="middle"
      fill="#ff9b94" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="20" font-weight="700">2557</text>

<text x="312" y="315" text-anchor="middle"
      fill="#ff7b72" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="17" font-weight="700">
  equality leaks immediately
</text>

<!-- malleability -->
<rect x="630" y="95" width="515" height="245" rx="22"
      fill="#231517" stroke="#ff7b72" stroke-width="2"/>

<text x="887" y="135" text-anchor="middle"
      fill="#fff0ef" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="24" font-weight="700">2 · Malleability</text>

<text x="720" y="190" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="18">c = Enc(42)</text>

<rect x="810" y="160" width="160" height="60" rx="14"
      fill="#171714" stroke="#f2b84b" stroke-width="2"/>
<text x="890" y="187" text-anchor="middle"
      fill="#fff8e8" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="16">× Enc(2)</text>
<text x="890" y="209" text-anchor="middle"
      fill="#f2b84b" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="15">publicly computable</text>

<line x1="780" y1="190" x2="800" y2="190"
      stroke="#ff7b72" stroke-width="3" marker-end="url(#arrowR)"/>
<line x1="970" y1="190" x2="1050" y2="190"
      stroke="#ff7b72" stroke-width="3" marker-end="url(#arrowR)"/>

<text x="1080" y="195" text-anchor="middle"
      fill="#ff9b94" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="18" font-weight="700">c'</text>

<line x1="1080" y1="220" x2="1080" y2="260"
      stroke="#ff7b72" stroke-width="3" marker-end="url(#arrowR)"/>

<text x="950" y="290" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="18">Dec(c') = 84 = 42·2</text>

<text x="887" y="315" text-anchor="middle"
      fill="#ff7b72" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="17" font-weight="700">
  attacker controls plaintext relation
</text>

<!-- OAEP -->
<rect x="155" y="395" width="890" height="155" rx="24"
      fill="#0e1c17" stroke="#58f7a6" stroke-width="2"/>

<text x="600" y="430" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="23" font-weight="700">
  Secure scheme architecture: randomized encoding before RSA
</text>

<rect x="210" y="465" width="150" height="50" rx="13"
      fill="#10251c" stroke="#58f7a6" stroke-width="2"/>
<text x="285" y="496" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="18">message M</text>

<rect x="445" y="455" width="250" height="70" rx="15"
      fill="#10251c" stroke="#58f7a6" stroke-width="2"/>
<text x="570" y="482" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="18" font-weight="700">OAEP encoding</text>
<text x="570" y="508" text-anchor="middle"
      fill="#58f7a6" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="15">fresh random seed + structure</text>

<rect x="790" y="465" width="150" height="50" rx="13"
      fill="#10251c" stroke="#58f7a6" stroke-width="2"/>
<text x="865" y="496" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="18">RSAEP</text>

<line x1="360" y1="490" x2="435" y2="490"
      stroke="#58f7a6" stroke-width="3" marker-end="url(#arrowG)"/>
<line x1="695" y1="490" x2="780" y2="490"
      stroke="#58f7a6" stroke-width="3" marker-end="url(#arrowG)"/>

<text x="600" y="592" text-anchor="middle"
      fill="#819c8d" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="16">
  The encoding is cryptographic structure, not cosmetic padding.
</text>
</svg>
