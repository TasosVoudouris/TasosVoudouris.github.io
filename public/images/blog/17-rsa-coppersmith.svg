<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Coppersmith small root attack pipeline</title>
<desc id="desc">A known-prefix RSA ciphertext produces a polynomial with hidden small modular root 37. Shifted polynomials that vanish modulo N squared are scaled by the root bound and encoded as lattice vectors. LLL finds a short vector, producing an integer polynomial whose ordinary root is 37.</desc>

<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0%" stop-color="#07110d"/>
    <stop offset="100%" stop-color="#0b1519"/>
  </linearGradient>
  <marker id="arrowG" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#58f7a6"/>
  </marker>
  <marker id="arrowGold" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#f2b84b"/>
  </marker>
</defs>

<rect width="1200" height="720" rx="28" fill="url(#bg)"/>

<text x="600" y="48" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="30" font-weight="700">
  Coppersmith: move a hidden root from the modular world into the integer world
</text>

<!-- RSA polynomial -->
<rect x="80" y="95" width="1040" height="105" rx="22"
      fill="#0e1c17" stroke="#58f7a6" stroke-width="2"/>
<text x="600" y="130" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="21" font-weight="700">
  RSA structure → small modular root
</text>
<text x="600" y="164" text-anchor="middle"
      fill="#58f7a6" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="20">
  f(x) = (12000 + x)³ − c · f(37) ≡ 0 (mod N) · |37| &lt; X = 100
</text>

<!-- shifts -->
<rect x="75" y="255" width="325" height="180" rx="20"
      fill="#171714" stroke="#f2b84b" stroke-width="2"/>
<text x="237" y="291" text-anchor="middle"
      fill="#fff8e8" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="21" font-weight="700">
  1 · manufacture relations
</text>
<text x="237" y="325" text-anchor="middle"
      fill="#f2b84b" font-family="Consolas,monospace"
      font-size="17">N², N²x, N²x²</text>
<text x="237" y="353" text-anchor="middle"
      fill="#f2b84b" font-family="Consolas,monospace"
      font-size="17">Nf, Nxf, Nx²f, f²</text>
<text x="237" y="397" text-anchor="middle"
      fill="#bdb39a" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="16">all vanish mod N² at x₀</text>

<!-- lattice -->
<rect x="438" y="255" width="325" height="180" rx="20"
      fill="#171714" stroke="#f2b84b" stroke-width="2"/>
<text x="600" y="291" text-anchor="middle"
      fill="#fff8e8" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="21" font-weight="700">
  2 · encode geometry
</text>
<text x="600" y="332" text-anchor="middle"
      fill="#f2b84b" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="19">x → Xx</text>
<text x="600" y="363" text-anchor="middle"
      fill="#f2b84b" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="17">coefficients → vectors in ℤ⁷</text>
<text x="600" y="397" text-anchor="middle"
      fill="#bdb39a" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="16">root bound becomes vector weights</text>

<!-- LLL -->
<rect x="800" y="255" width="325" height="180" rx="20"
      fill="#231517" stroke="#ff7b72" stroke-width="2"/>
<text x="962" y="291" text-anchor="middle"
      fill="#fff0ef" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="21" font-weight="700">
  3 · LLL short vector
</text>
<text x="962" y="331" text-anchor="middle"
      fill="#ff9b94" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="18">||v|| ≈ 2.958 × 10¹⁷</text>
<text x="962" y="362" text-anchor="middle"
      fill="#ff9b94" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="17">threshold ≈ 4.177 × 10¹⁷</text>
<text x="962" y="397" text-anchor="middle"
      fill="#c8a4a1" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="16">short enough</text>

<line x1="400" y1="345" x2="428" y2="345"
      stroke="#f2b84b" stroke-width="3" marker-end="url(#arrowGold)"/>
<line x1="763" y1="345" x2="790" y2="345"
      stroke="#ff7b72" stroke-width="3" marker-end="url(#arrowG)"/>

<!-- theorem bridge -->
<rect x="215" y="490" width="770" height="105" rx="21"
      fill="#10251c" stroke="#58f7a6" stroke-width="2"/>
<text x="600" y="523" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="21" font-weight="700">
  N² | h(x₀)  and  |h(x₀)| &lt; N²
</text>
<text x="600" y="558" text-anchor="middle"
      fill="#58f7a6" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="24" font-weight="700">
  therefore h(x₀) = 0 over ℤ
</text>

<path d="M962 435 C900 465,800 478,740 488"
      fill="none" stroke="#58f7a6" stroke-width="3" marker-end="url(#arrowG)"/>

<!-- root -->
<rect x="355" y="635" width="490" height="62" rx="18"
      fill="#231517" stroke="#ff7b72" stroke-width="2"/>
<text x="600" y="661" text-anchor="middle"
      fill="#fff0ef" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="20" font-weight="700">
  integer root x₀ = 37 → plaintext M = 12037
</text>
<text x="600" y="685" text-anchor="middle"
      fill="#ff9b94" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="16">
  no factorization · no private exponent · no small_roots() black box
</text>

<line x1="600" y1="595" x2="600" y2="625"
      stroke="#ff7b72" stroke-width="3" marker-end="url(#arrowG)"/>
</svg>
