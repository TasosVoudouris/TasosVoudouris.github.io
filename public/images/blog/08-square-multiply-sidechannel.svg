<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">Square-and-multiply side-channel trace</title>
<desc id="desc">The binary exponent 1101 drives a square-and-multiply implementation. One bits cause square and multiply while the zero bit causes only square, producing a secret-dependent operation trace.</desc>

<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0%" stop-color="#07110d"/>
    <stop offset="100%" stop-color="#0b1519"/>
  </linearGradient>
  <marker id="arrowG" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#58f7a6"/>
  </marker>
  <marker id="arrowR" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#ff7b72"/>
  </marker>
</defs>

<rect width="1200" height="590" rx="28" fill="url(#bg)"/>

<text x="600" y="52" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="30" font-weight="700">
  The result can be correct while the execution leaks the secret
</text>

<!-- exponent -->
<rect x="415" y="90" width="370" height="92" rx="20"
      fill="#0e1c17" stroke="#58f7a6" stroke-width="2"/>
<text x="600" y="125" text-anchor="middle" fill="#eafff3"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">
  secret exponent d = 13
</text>
<text x="600" y="158" text-anchor="middle" fill="#58f7a6"
      font-family="Consolas,monospace" font-size="28" font-weight="700">
  1 1 0 1
</text>

<line x1="600" y1="182" x2="600" y2="220"
      stroke="#58f7a6" stroke-width="3" marker-end="url(#arrowG)"/>

<!-- bit boxes -->
<g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
  <rect x="80" y="245" width="230" height="118" rx="20" fill="#10251c" stroke="#58f7a6" stroke-width="2"/>
  <text x="195" y="278" fill="#eafff3" font-size="20" font-weight="700">bit = 1</text>
  <text x="195" y="314" fill="#58f7a6" font-size="23">S → M</text>
  <text x="195" y="342" fill="#9bb9aa" font-size="15">square + multiply</text>

  <rect x="350" y="245" width="230" height="118" rx="20" fill="#10251c" stroke="#58f7a6" stroke-width="2"/>
  <text x="465" y="278" fill="#eafff3" font-size="20" font-weight="700">bit = 1</text>
  <text x="465" y="314" fill="#58f7a6" font-size="23">S → M</text>
  <text x="465" y="342" fill="#9bb9aa" font-size="15">square + multiply</text>

  <rect x="620" y="245" width="230" height="118" rx="20" fill="#231517" stroke="#ff7b72" stroke-width="2"/>
  <text x="735" y="278" fill="#fff0ef" font-size="20" font-weight="700">bit = 0</text>
  <text x="735" y="314" fill="#ff7b72" font-size="23">S</text>
  <text x="735" y="342" fill="#c8a4a1" font-size="15">multiply skipped</text>

  <rect x="890" y="245" width="230" height="118" rx="20" fill="#10251c" stroke="#58f7a6" stroke-width="2"/>
  <text x="1005" y="278" fill="#eafff3" font-size="20" font-weight="700">bit = 1</text>
  <text x="1005" y="314" fill="#58f7a6" font-size="23">S → M</text>
  <text x="1005" y="342" fill="#9bb9aa" font-size="15">square + multiply</text>
</g>

<!-- trace -->
<rect x="230" y="410" width="740" height="84" rx="20"
      fill="#171714" stroke="#f2b84b" stroke-width="2"/>
<text x="600" y="443" text-anchor="middle" fill="#fff8e8"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">
  observable toy operation trace
</text>
<text x="600" y="476" text-anchor="middle" fill="#f2b84b"
      font-family="Consolas,monospace" font-size="25" font-weight="700">
  S M  |  S M  |  S  |  S M
</text>

<path d="M600 363 L600 400"
      fill="none" stroke="#ff7b72" stroke-width="3" marker-end="url(#arrowR)"/>

<!-- bottom -->
<text x="295" y="540" text-anchor="middle" fill="#58f7a6"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">
  output: 7¹³ mod 23 = 20 ✓
</text>
<text x="905" y="540" text-anchor="middle" fill="#ff7b72"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">
  trace: depends on secret bits ✗
</text>

<text x="600" y="572" text-anchor="middle" fill="#819c8d"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">
  Side-channel security asks what the computation reveals beyond its mathematical output.
</text>
</svg>
