<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Chinese Remainder Theorem reconstruction</title>
<desc id="desc">Three modular views x equals 2 modulo 3, 3 modulo 5, and 2 modulo 7 are combined through the Chinese Remainder Theorem into x equals 23 modulo 105.</desc>

<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0%" stop-color="#07110d"/>
    <stop offset="100%" stop-color="#0b1519"/>
  </linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#58f7a6"/>
  </marker>
</defs>

<rect width="1200" height="560" rx="28" fill="url(#bg)"/>

<text x="600" y="54" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="30" font-weight="700">
  Several modular views → one global residue class
</text>

<!-- modular worlds -->
<rect x="70" y="120" width="290" height="130" rx="22"
      fill="#0e1c17" stroke="#58f7a6" stroke-width="2"/>
<text x="215" y="162" text-anchor="middle" fill="#eafff3"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">
  modulo 3
</text>
<text x="215" y="205" text-anchor="middle" fill="#58f7a6"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25">
  x ≡ 2
</text>

<rect x="455" y="120" width="290" height="130" rx="22"
      fill="#0e1c17" stroke="#58f7a6" stroke-width="2"/>
<text x="600" y="162" text-anchor="middle" fill="#eafff3"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">
  modulo 5
</text>
<text x="600" y="205" text-anchor="middle" fill="#58f7a6"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25">
  x ≡ 3
</text>

<rect x="840" y="120" width="290" height="130" rx="22"
      fill="#0e1c17" stroke="#58f7a6" stroke-width="2"/>
<text x="985" y="162" text-anchor="middle" fill="#eafff3"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">
  modulo 7
</text>
<text x="985" y="205" text-anchor="middle" fill="#58f7a6"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25">
  x ≡ 2
</text>

<!-- arrows -->
<path d="M215 250 C270 310,390 330,495 355"
      fill="none" stroke="#58f7a6" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M600 250 L600 345"
      fill="none" stroke="#58f7a6" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M985 250 C930 310,810 330,705 355"
      fill="none" stroke="#58f7a6" stroke-width="3" marker-end="url(#arrow)"/>

<!-- CRT -->
<rect x="470" y="350" width="260" height="74" rx="20"
      fill="#171714" stroke="#f2b84b" stroke-width="2"/>
<text x="600" y="382" text-anchor="middle" fill="#fff8e8"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">
  CRT
</text>
<text x="600" y="408" text-anchor="middle" fill="#f2b84b"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">
  combine the modular coordinates
</text>

<line x1="600" y1="424" x2="600" y2="458"
      stroke="#58f7a6" stroke-width="3" marker-end="url(#arrow)"/>

<!-- result -->
<rect x="360" y="463" width="480" height="70" rx="20"
      fill="#10251c" stroke="#58f7a6" stroke-width="2"/>
<text x="600" y="493" text-anchor="middle" fill="#eafff3"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">
  x ≡ 23 (mod 105)
</text>
<text x="600" y="519" text-anchor="middle" fill="#9bb9aa"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">
  unique modulo 3 · 5 · 7
</text>
</svg>
