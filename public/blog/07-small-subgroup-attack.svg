<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Small subgroup attack</title>
<desc id="desc">A victim secret exponent intended for a subgroup of order 53 is evaluated on attacker-controlled elements of orders 3, 4, and 5. The resulting residues are combined with CRT to recover the secret.</desc>

<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0%" stop-color="#07110d"/>
    <stop offset="100%" stop-color="#0b1519"/>
  </linearGradient>
  <marker id="arrowG" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#58f7a6"/>
  </marker>
  <marker id="arrowR" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#ff7b72"/>
  </marker>
</defs>

<rect width="1200" height="620" rx="28" fill="url(#bg)"/>

<text x="600" y="52" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="30" font-weight="700">
  A large intended subgroup does not help if the attacker chooses the input group
</text>

<!-- intended -->
<rect x="390" y="90" width="420" height="105" rx="22"
      fill="#0e1c17" stroke="#58f7a6" stroke-width="2"/>
<text x="600" y="127" text-anchor="middle" fill="#eafff3"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">
  Intended subgroup G = ⟨g⟩
</text>
<text x="600" y="160" text-anchor="middle" fill="#58f7a6"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">
  |G| = 53 · victim secret d = 47
</text>

<!-- attacker -->
<rect x="455" y="235" width="290" height="72" rx="18"
      fill="#231517" stroke="#ff7b72" stroke-width="2"/>
<text x="600" y="264" text-anchor="middle" fill="#fff0ef"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">
  attacker-controlled inputs
</text>
<text x="600" y="290" text-anchor="middle" fill="#ff7b72"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">
  secret exponentiation leaves G
</text>

<line x1="600" y1="195" x2="600" y2="225"
      stroke="#ff7b72" stroke-width="3" marker-end="url(#arrowR)"/>

<!-- small groups -->
<rect x="85" y="355" width="280" height="120" rx="20"
      fill="#171714" stroke="#f2b84b" stroke-width="2"/>
<text x="225" y="390" text-anchor="middle" fill="#fff8e8"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">
  order 3
</text>
<text x="225" y="422" text-anchor="middle" fill="#f2b84b"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">
  T₃ = 440
</text>
<text x="225" y="450" text-anchor="middle" fill="#fff8e8"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">
  d ≡ 2 (mod 3)
</text>

<rect x="460" y="355" width="280" height="120" rx="20"
      fill="#171714" stroke="#f2b84b" stroke-width="2"/>
<text x="600" y="390" text-anchor="middle" fill="#fff8e8"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">
  order 4
</text>
<text x="600" y="422" text-anchor="middle" fill="#f2b84b"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">
  T₄ = 2899
</text>
<text x="600" y="450" text-anchor="middle" fill="#fff8e8"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">
  d ≡ 3 (mod 4)
</text>

<rect x="835" y="355" width="280" height="120" rx="20"
      fill="#171714" stroke="#f2b84b" stroke-width="2"/>
<text x="975" y="390" text-anchor="middle" fill="#fff8e8"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">
  order 5
</text>
<text x="975" y="422" text-anchor="middle" fill="#f2b84b"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">
  T₅ = 425
</text>
<text x="975" y="450" text-anchor="middle" fill="#fff8e8"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">
  d ≡ 2 (mod 5)
</text>

<path d="M535 307 C450 325,335 336,270 350"
      fill="none" stroke="#ff7b72" stroke-width="3" marker-end="url(#arrowR)"/>
<path d="M600 307 L600 345"
      fill="none" stroke="#ff7b72" stroke-width="3" marker-end="url(#arrowR)"/>
<path d="M665 307 C750 325,865 336,930 350"
      fill="none" stroke="#ff7b72" stroke-width="3" marker-end="url(#arrowR)"/>

<!-- CRT -->
<rect x="385" y="515" width="430" height="72" rx="18"
      fill="#10251c" stroke="#58f7a6" stroke-width="2"/>
<text x="600" y="545" text-anchor="middle" fill="#eafff3"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">
  CRT: d ≡ 47 (mod 60)
</text>
<text x="600" y="572" text-anchor="middle" fill="#58f7a6"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">
  since 0 ≤ d &lt; 53 → d = 47
</text>

<path d="M225 475 C300 500,400 510,470 515"
      fill="none" stroke="#58f7a6" stroke-width="2.5" marker-end="url(#arrowG)"/>
<path d="M600 475 L600 505"
      fill="none" stroke="#58f7a6" stroke-width="2.5" marker-end="url(#arrowG)"/>
<path d="M975 475 C900 500,800 510,730 515"
      fill="none" stroke="#58f7a6" stroke-width="2.5" marker-end="url(#arrowG)"/>
</svg>
