<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">RSA key generation from primes to public and private keys</title>
<desc id="desc">Two secret primes p and q produce the public modulus N and Carmichael function lambda N. A public exponent e coprime to lambda N is inverted to obtain the private exponent d, producing public and private RSA keys.</desc>

<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0%" stop-color="#07110d"/>
    <stop offset="100%" stop-color="#0b1519"/>
  </linearGradient>
  <marker id="arrowG" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#58f7a6"/>
  </marker>
  <marker id="arrowGold" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#f2b84b"/>
  </marker>
</defs>

<rect width="1200" height="620" rx="28" fill="url(#bg)"/>

<text x="600" y="52" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="30" font-weight="700">
  RSA key generation is the number-theory chain coming together
</text>

<!-- primes -->
<rect x="90" y="110" width="250" height="105" rx="20"
      fill="#231517" stroke="#ff7b72" stroke-width="2"/>
<text x="215" y="148" text-anchor="middle"
      fill="#fff0ef" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="22" font-weight="700">secret primes</text>
<text x="215" y="185" text-anchor="middle"
      fill="#ff9b94" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="24">p = 61 · q = 53</text>

<!-- N -->
<rect x="470" y="90" width="260" height="92" rx="20"
      fill="#0e1c17" stroke="#58f7a6" stroke-width="2"/>
<text x="600" y="125" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="21" font-weight="700">public modulus</text>
<text x="600" y="158" text-anchor="middle"
      fill="#58f7a6" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="23">N = pq = 3233</text>

<!-- lambda -->
<rect x="470" y="225" width="260" height="92" rx="20"
      fill="#0e1c17" stroke="#58f7a6" stroke-width="2"/>
<text x="600" y="260" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="20" font-weight="700">hidden cycle length</text>
<text x="600" y="293" text-anchor="middle"
      fill="#58f7a6" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="22">λ(N) = lcm(60,52) = 780</text>

<path d="M340 155 C390 145,425 135,460 132"
      fill="none" stroke="#58f7a6" stroke-width="3" marker-end="url(#arrowG)"/>
<path d="M340 180 C400 220,430 248,460 260"
      fill="none" stroke="#58f7a6" stroke-width="3" marker-end="url(#arrowG)"/>

<!-- e -->
<rect x="90" y="350" width="300" height="100" rx="20"
      fill="#171714" stroke="#f2b84b" stroke-width="2"/>
<text x="240" y="385" text-anchor="middle"
      fill="#fff8e8" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="21" font-weight="700">choose public e = 17</text>
<text x="240" y="420" text-anchor="middle"
      fill="#f2b84b" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="19">gcd(17,780) = 1</text>

<!-- inverse -->
<rect x="450" y="350" width="300" height="100" rx="20"
      fill="#171714" stroke="#f2b84b" stroke-width="2"/>
<text x="600" y="385" text-anchor="middle"
      fill="#fff8e8" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="21" font-weight="700">Extended Euclid</text>
<text x="600" y="420" text-anchor="middle"
      fill="#f2b84b" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="19">d = 17⁻¹ mod 780 = 413</text>

<line x1="390" y1="400" x2="440" y2="400"
      stroke="#f2b84b" stroke-width="3" marker-end="url(#arrowGold)"/>
<line x1="600" y1="317" x2="600" y2="340"
      stroke="#f2b84b" stroke-width="3" marker-end="url(#arrowGold)"/>

<!-- keys -->
<rect x="805" y="300" width="315" height="100" rx="20"
      fill="#10251c" stroke="#58f7a6" stroke-width="2"/>
<text x="962" y="338" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="21" font-weight="700">public key</text>
<text x="962" y="373" text-anchor="middle"
      fill="#58f7a6" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="22">(3233, 17)</text>

<rect x="805" y="445" width="315" height="110" rx="20"
      fill="#231517" stroke="#ff7b72" stroke-width="2"/>
<text x="962" y="483" text-anchor="middle"
      fill="#fff0ef" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="21" font-weight="700">private material</text>
<text x="962" y="517" text-anchor="middle"
      fill="#ff9b94" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="19">d = 413 · p · q · CRT data</text>

<path d="M750 385 C785 365,790 350,795 350"
      fill="none" stroke="#58f7a6" stroke-width="3" marker-end="url(#arrowG)"/>
<path d="M750 415 C790 460,795 485,795 490"
      fill="none" stroke="#ff7b72" stroke-width="3" marker-end="url(#arrowG)"/>

<!-- bottom -->
<rect x="235" y="505" width="490" height="72" rx="18"
      fill="#0e1c17" stroke="#58f7a6" stroke-width="2"/>
<text x="480" y="534" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="18" font-weight="700">
  65¹⁷ mod 3233 = 2790
</text>
<text x="480" y="561" text-anchor="middle"
      fill="#58f7a6" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="18">
  2790⁴¹³ mod 3233 = 65
</text>

<text x="600" y="606" text-anchor="middle"
      fill="#819c8d" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="16">
  Toy arithmetic only: secure RSA schemes require standardized key generation and encoding.
</text>
</svg>
