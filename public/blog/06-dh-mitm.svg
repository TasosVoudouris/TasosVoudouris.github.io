<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Man-in-the-middle attack against Diffie-Hellman</title>
<desc id="desc">Alice and Bob's public Diffie-Hellman values are intercepted by Eve, who substitutes her own values and establishes two separate shared secrets.</desc>

<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0%" stop-color="#07110d"/>
    <stop offset="100%" stop-color="#0b1519"/>
  </linearGradient>
  <marker id="greenArrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#58f7a6"/>
  </marker>
  <marker id="redArrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#ff7b72"/>
  </marker>
</defs>

<rect width="1200" height="620" rx="28" fill="url(#bg)"/>

<text x="600" y="52" text-anchor="middle"
      fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="30" font-weight="700">
  The mathematics still works — with the wrong peer
</text>

<!-- Nodes -->
<rect x="65" y="115" width="260" height="145" rx="22"
      fill="#0e1c17" stroke="#58f7a6" stroke-width="2"/>
<text x="195" y="155" text-anchor="middle" fill="#eafff3"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Alice</text>
<text x="195" y="190" text-anchor="middle" fill="#9bb9aa"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">secret a = 6</text>
<text x="195" y="225" text-anchor="middle" fill="#58f7a6"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">A = 8</text>

<rect x="470" y="95" width="260" height="185" rx="22"
      fill="#231517" stroke="#ff7b72" stroke-width="3"/>
<text x="600" y="137" text-anchor="middle" fill="#fff0ef"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Eve</text>
<text x="600" y="172" text-anchor="middle" fill="#c8a4a1"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">e_A = 3 → E_A = 10</text>
<text x="600" y="203" text-anchor="middle" fill="#c8a4a1"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">e_B = 7 → E_B = 17</text>
<text x="600" y="244" text-anchor="middle" fill="#ff7b72"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">controls the channel</text>

<rect x="875" y="115" width="260" height="145" rx="22"
      fill="#0e1c17" stroke="#58f7a6" stroke-width="2"/>
<text x="1005" y="155" text-anchor="middle" fill="#eafff3"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Bob</text>
<text x="1005" y="190" text-anchor="middle" fill="#9bb9aa"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">secret b = 15</text>
<text x="1005" y="225" text-anchor="middle" fill="#58f7a6"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">B = 19</text>

<!-- Intercepted originals -->
<line x1="325" y1="145" x2="458" y2="145" stroke="#819c8d" stroke-width="3"/>
<text x="392" y="130" text-anchor="middle" fill="#9bb9aa"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">A = 8</text>
<line x1="446" y1="128" x2="462" y2="162" stroke="#ff7b72" stroke-width="4"/>
<line x1="462" y1="128" x2="446" y2="162" stroke="#ff7b72" stroke-width="4"/>

<line x1="875" y1="145" x2="742" y2="145" stroke="#819c8d" stroke-width="3"/>
<text x="808" y="130" text-anchor="middle" fill="#9bb9aa"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">B = 19</text>
<line x1="738" y1="128" x2="754" y2="162" stroke="#ff7b72" stroke-width="4"/>
<line x1="754" y1="128" x2="738" y2="162" stroke="#ff7b72" stroke-width="4"/>

<!-- Replacement values -->
<line x1="470" y1="225" x2="335" y2="225"
      stroke="#ff7b72" stroke-width="3" marker-end="url(#redArrow)"/>
<text x="402" y="212" text-anchor="middle" fill="#ff7b72"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">E_A = 10</text>

<line x1="730" y1="225" x2="865" y2="225"
      stroke="#ff7b72" stroke-width="3" marker-end="url(#redArrow)"/>
<text x="798" y="212" text-anchor="middle" fill="#ff7b72"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">E_B = 17</text>

<!-- Keys -->
<rect x="110" y="335" width="370" height="115" rx="20"
      fill="#10251c" stroke="#58f7a6" stroke-width="2"/>
<text x="295" y="372" text-anchor="middle" fill="#eafff3"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">
  Alice ↔ Eve
</text>
<text x="295" y="407" text-anchor="middle" fill="#58f7a6"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">
  10⁶ mod 23 = 8³ mod 23 = 6
</text>
<text x="295" y="433" text-anchor="middle" fill="#9bb9aa"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">
  shared key material: 6
</text>

<rect x="720" y="335" width="370" height="115" rx="20"
      fill="#10251c" stroke="#58f7a6" stroke-width="2"/>
<text x="905" y="372" text-anchor="middle" fill="#eafff3"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">
  Eve ↔ Bob
</text>
<text x="905" y="407" text-anchor="middle" fill="#58f7a6"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">
  19⁷ mod 23 = 17¹⁵ mod 23 = 15
</text>
<text x="905" y="433" text-anchor="middle" fill="#9bb9aa"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">
  shared key material: 15
</text>

<rect x="365" y="490" width="470" height="72" rx="18"
      fill="#231517" stroke="#ff7b72" stroke-width="2"/>
<text x="600" y="520" text-anchor="middle" fill="#fff0ef"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">
  Alice and Bob never authenticate each other's DH share
</text>
<text x="600" y="548" text-anchor="middle" fill="#ff7b72"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">
  result: two valid sessions, controlled by Eve
</text>

<text x="600" y="595" text-anchor="middle" fill="#819c8d"
      font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">
  Hard discrete logarithms do not provide identity authentication.
</text>
</svg>
