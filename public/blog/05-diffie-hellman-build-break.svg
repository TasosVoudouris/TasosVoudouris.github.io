<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Toy Diffie-Hellman build and break</title>
<desc id="desc">Alice and Bob exchange public Diffie-Hellman values and derive the same shared value. Eve then brute-forces Alice's tiny exponent.</desc>
<defs>
<linearGradient id="bg" x1="0" x2="1"><stop offset="0%" stop-color="#07110d"/><stop offset="100%" stop-color="#0b1519"/></linearGradient>
<marker id="g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#58f7a6"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff7b72"/></marker>
</defs>
<rect width="1200" height="600" rx="28" fill="url(#bg)"/>
<text x="600" y="48" text-anchor="middle" fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Diffie-Hellman: build the agreement, then attack the toy parameters</text>
<text x="70" y="100" fill="#58f7a6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">BUILD</text>
<rect x="70" y="125" width="250" height="140" rx="20" fill="#0e1c17" stroke="#58f7a6" stroke-width="2"/>
<text x="195" y="160" text-anchor="middle" fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Alice</text>
<text x="195" y="195" text-anchor="middle" fill="#9bb9aa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">secret a = 6</text>
<text x="195" y="225" text-anchor="middle" fill="#58f7a6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">A = 5⁶ mod 23 = 8</text>
<rect x="880" y="125" width="250" height="140" rx="20" fill="#0e1c17" stroke="#58f7a6" stroke-width="2"/>
<text x="1005" y="160" text-anchor="middle" fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Bob</text>
<text x="1005" y="195" text-anchor="middle" fill="#9bb9aa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">secret b = 15</text>
<text x="1005" y="225" text-anchor="middle" fill="#58f7a6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">B = 5¹⁵ mod 23 = 19</text>
<line x1="320" y1="175" x2="870" y2="175" stroke="#58f7a6" stroke-width="3" marker-end="url(#g)"/><text x="595" y="160" text-anchor="middle" fill="#9bb9aa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">A = 8</text>
<line x1="880" y1="225" x2="330" y2="225" stroke="#58f7a6" stroke-width="3" marker-end="url(#g)"/><text x="605" y="255" text-anchor="middle" fill="#9bb9aa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">B = 19</text>
<rect x="390" y="285" width="420" height="78" rx="18" fill="#10251c" stroke="#58f7a6" stroke-width="2"/>
<text x="600" y="316" text-anchor="middle" fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Alice: 19⁶ mod 23 = 2</text><text x="600" y="344" text-anchor="middle" fill="#eafff3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Bob: 8¹⁵ mod 23 = 2</text>
<line x1="70" y1="395" x2="1130" y2="395" stroke="#294238" stroke-width="2"/>
<text x="70" y="438" fill="#ff7b72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">BREAK</text>
<rect x="70" y="460" width="230" height="95" rx="18" fill="#231517" stroke="#ff7b72" stroke-width="2"/><text x="185" y="492" text-anchor="middle" fill="#fff0ef" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Eve sees</text><text x="185" y="525" text-anchor="middle" fill="#c8a4a1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">p=23, g=5, A=8, B=19</text>
<rect x="390" y="460" width="310" height="95" rx="18" fill="#231517" stroke="#ff7b72" stroke-width="2"/><text x="545" y="492" text-anchor="middle" fill="#fff0ef" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Try x = 0,1,2,...</text><text x="545" y="525" text-anchor="middle" fill="#ff7b72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">find 5ˣ mod 23 = 8</text>
<rect x="790" y="460" width="340" height="95" rx="18" fill="#231517" stroke="#ff7b72" stroke-width="2"/><text x="960" y="492" text-anchor="middle" fill="#fff0ef" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Recovered a = 6</text><text x="960" y="525" text-anchor="middle" fill="#ff7b72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">19⁶ mod 23 = shared value 2</text>
<line x1="300" y1="507" x2="380" y2="507" stroke="#ff7b72" stroke-width="3" marker-end="url(#r)"/><line x1="700" y1="507" x2="780" y2="507" stroke="#ff7b72" stroke-width="3" marker-end="url(#r)"/>
<text x="600" y="585" text-anchor="middle" fill="#819c8d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Correct protocol algebra does not compensate for a tiny search space.</text>
</svg>